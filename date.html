<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Запрошення на побачення 💗</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pacifico&display=swap&subset=cyrillic" rel="stylesheet">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/background.css">
    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/invite.css">

    <script type="module" src="js/hearts.js" defer></script>
    <script type="module" src="js/invite.js" defer></script>
</head>
<body>

<div class="bg" aria-hidden="true">
    <div class="hearts"></div>
</div>

<main class="invite">
    <section class="invite__card glass">

        <h1 class="invite__title">Запрошення на побачення</h1>

        <form id="invite-form" class="form">

            <div class="field">
                <label class="field__label" for="place">Де зустрінемось?</label>
                <select class="field__input" id="place" name="place" required>
                    <option value="" disabled selected>Оберіть місце</option>
                    <option value="Гуртожиток №1">Гуртожиток №1</option>
                    <option value="Гуртожиток №4">Гуртожиток №4</option>
                </select>
            </div>

            <div class="field">
                <label class="field__label" for="time">Коли зустрінемось</label>
                <input class="field__input" type="time" id="time" name="time" required>
            </div>

            <div class="field">
                <label class="field__label" for="where">Куди підемо</label>
                <input class="field__input" type="text" id="where" name="where"
                       maxlength="300" placeholder="Напиши, куди хочеш піти" required>
            </div>

            <button class="btn" type="submit">Надіслати</button>
        </form>

        <p class="form__status" id="form-status" role="status"></p>

        <div id="invite-done" class="invite__done" tabindex="-1" hidden>
            <p class="invite__done-text">Дякую, з нетерпінням чекатиму на зустріч 💗</p>
            <a class="btn" href="index.html">До листівки</a>
        </div>

    </section>
</main>

</body>
</html>
